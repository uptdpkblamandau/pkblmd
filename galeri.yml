name: Perbarui galeri

on:
  push:
    paths:
      - 'gambar/galeri/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: galeri

jobs:
  galeri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python galeri.py
      - name: Simpan hasil
        run: |
          git config user.name "galeri-otomatis"
          git config user.email "galeri-otomatis@users.noreply.github.com"
          git add gambar/galeri galeri.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "Perbarui galeri otomatis"
            git pull --rebase
            git push
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
